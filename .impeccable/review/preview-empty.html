<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foundry — Bangun kosong</title>
  <link rel="stylesheet" href="../../apps/web/src/styles.css" />
</head>
<body>
<div class="wb">
  <div class="menubar">
    <span class="menubar-logo">Foundry</span>
    <button class="menu-btn">Berkas</button>
    <span class="menubar-title">klinik-antrian</span>
  </div>
  <div class="wb-main">
    <div class="activitybar">
      <button class="act active" title="Bangun"></button>
    </div>
    <div class="editor">
      <div class="tabbar"><div class="tab-item active"><span>Bangun</span></div></div>
      <div class="editor-content">
        <div class="build">
          <div class="build-empty">
            <h1>Belum ada task</h1>
            <p class="muted">Setujui rancangan dulu. Foundry pecah jadi task di papan ini.</p>
            <a class="button primary" href="#">Ke Rancang</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="statusbar"><span class="sb-item">Bangun</span></div>
</div>
</body>
</html>
